<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITB_otc — 10s Live Chart + Indicators</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #131722; color: #d1d4dc; }
        #header { padding: 12px 20px; background: #1e222d; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        #chartWrap { position: relative; width: 100%; height: calc(100vh - 50px); }
        #chart { width: 100%; height: 100%; }
        #status { font-size: 13px; color: #787b86; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .ok { background: #26a69a; color: white; }
        .err { background: #ef5350; color: white; }
        .warn { background: #f0a500; color: white; }

        /* Overlay panel: RSI, BB bandwidth, EMA signal */
        #overlay {
            position: absolute; top: 12px; left: 12px;
            background: rgba(30, 34, 45, 0.92);
            border: 1px solid #2a2e39;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.55;
            min-width: 260px;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #overlay h3 { margin: 0 0 6px 0; font-size: 12px; letter-spacing: 1px; color: #787b86; text-transform: uppercase; }
        .row { display: flex; justify-content: space-between; gap: 12px; }
        .row .label { color: #787b86; }
        .row .value { font-variant-numeric: tabular-nums; }
        .pos { color: #26a69a; }
        .neg { color: #ef5350; }
        .neutral { color: #d1d4dc; }
        .big-signal { font-size: 14px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="header">
        <div><strong>BITB_otc</strong> — 10s Candles + RSI(14) + BB(20,2) + EMA(6)</div>
        <div id="status">Connecting...</div>
    </div>

    <div id="chartWrap">
        <div id="chart"></div>

        <div id="overlay">
            <h3>Live Indicators</h3>
            <div class="row"><span class="label">RSI(14)</span><span class="value" id="rsiVal">—</span></div>
            <div class="row"><span class="label">EMA(6)</span><span class="value" id="emaVal">—</span></div>
            <div class="row"><span class="label">Price vs EMA</span><span class="value big-signal" id="emaSignal">—</span></div>
            <div class="row"><span class="label">% to Upper BB</span><span class="value" id="bbUp">—</span></div>
            <div class="row"><span class="label">% to Lower BB</span><span class="value" id="bbLo">—</span></div>
            <div class="row"><span class="label">BB Upper</span><span class="value" id="bbUpper">—</span></div>
            <div class="row"><span class="label">BB Lower</span><span class="value" id="bbLower">—</span></div>
        </div>
    </div>

    <script>
    const chartContainer = document.getElementById('chart');
    const statusEl = document.getElementById('status');

    const chart = LightweightCharts.createChart(chartContainer, {
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
        timeScale: { timeVisible: true, secondsVisible: true, borderColor: '#2a2e39' },
        rightPriceScale: { borderColor: '#2a2e39' },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });

    // Bollinger Bands: 3 line series
    const bbUpperSeries = chart.addLineSeries({
        color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
    });
    const bbMiddleSeries = chart.addLineSeries({
        color: '#f0a500', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false,
    });
    const bbLowerSeries = chart.addLineSeries({
        color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
    });

    // EMA(6)
    const emaSeries = chart.addLineSeries({
        color: '#e91e63', lineWidth: 2, priceLineVisible: false,
    });

    // Track state
    let initializedChart = false;

    function fmt(n, digits = 5) {
        if (n === null || n === undefined || isNaN(n)) return '—';
        return Number(n).toFixed(digits);
    }
    function fmtPct(n) {
        if (n === null || n === undefined || isNaN(n)) return '—';
        return Number(n).toFixed(2) + '%';
    }
    function colorClass(n, threshold = 0) {
        if (n === null || n === undefined) return 'neutral';
        if (n > threshold) return 'pos';
        if (n < threshold) return 'neg';
        return 'neutral';
    }

    async function tick() {
        try {
            const res = await fetch('/api/candles');
            const data = await res.json();

            // Build candle array
            const formatted = data.candles.map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close,
            }));

            // Build BB band arrays (only for closed candles, using the cached value
            // at each closed candle is not stored, so we display BB at the latest
            // point only — see NOTE below).
            // To display historical BB we would need to recompute per candle; we
            // recompute BB on the frontend per closed candle for the chart lines.
            const bbUpperData = [];
            const bbMiddleData = [];
            const bbLowerData = [];
            const emaData = [];

            // ---- Recompute indicators per candle on the frontend for chart lines ----
            // (This keeps the backend light and the display perfectly aligned.)
            const closes = [];
            const RSI_PERIOD = data.indicators.rsi_period || 14;
            const BB_PERIOD = data.indicators.bb_period || 20;
            const BB_STD = data.indicators.bb_std || 2.0;
            const EMA_PERIOD = data.indicators.ema_period || 6;

            for (let i = 0; i < formatted.length; i++) {
                closes.push(formatted[i].close);
                const t = formatted[i].time;

                // BB
                if (closes.length >= BB_PERIOD) {
                    const win = closes.slice(-BB_PERIOD);
                    const mean = win.reduce((a,b)=>a+b,0) / BB_PERIOD;
                    const variance = win.reduce((a,b)=>a+(b-mean)**2,0) / BB_PERIOD;
                    const sd = Math.sqrt(variance);
                    bbUpperData.push({ time: t, value: mean + BB_STD*sd });
                    bbMiddleData.push({ time: t, value: mean });
                    bbLowerData.push({ time: t, value: mean - BB_STD*sd });
                }
                // EMA
                if (closes.length >= EMA_PERIOD) {
                    if (emaData.length === 0) {
                        const seed = closes.slice(0, EMA_PERIOD).reduce((a,b)=>a+b,0) / EMA_PERIOD;
                        emaData.push({ time: formatted[EMA_PERIOD-1].time, value: seed });
                        // Recompute forward
                        let ema = seed;
                        const k = 2/(EMA_PERIOD+1);
                        for (let j = EMA_PERIOD; j <= i; j++) {
                            ema = closes[j]*k + ema*(1-k);
                        }
                        if (i > EMA_PERIOD-1) {
                            emaData[emaData.length-1] = { time: t, value: ema };
                        }
                    } else {
                        // Continue updating the last EMA value incrementally
                        const k = 2/(EMA_PERIOD+1);
                        const prev = emaData[emaData.length-1].value;
                        const nextEma = closes[i]*k + prev*(1-k);
                        emaData.push({ time: t, value: nextEma });
                    }
                }
            }

            // Set data
            candleSeries.setData(formatted);
            bbUpperSeries.setData(bbUpperData);
            bbMiddleSeries.setData(bbMiddleData);
            bbLowerSeries.setData(bbLowerData);
            emaSeries.setData(emaData);

            // Update forming candle
            if (data.forming) {
                candleSeries.update({
                    time: data.forming.time,
                    open: data.forming.open,
                    high: data.forming.high,
                    low: data.forming.low,
                    close: data.forming.close,
                });
            }

            if (!initializedChart && formatted.length > 0) {
                chart.timeScale().fitContent();
                initializedChart = true;
            }

            // ---- Overlay panel ----
            const ind = data.indicators || {};
            document.getElementById('rsiVal').textContent = fmt(ind.rsi, 2);
            document.getElementById('rsiVal').className = 'value ' + colorClass(ind.rsi - 50);

            document.getElementById('emaVal').textContent = fmt(ind.ema, 5);
            const emaSig = document.getElementById('emaSignal');
            emaSig.textContent = ind.ema_signal || '—';
            emaSig.className = 'value big-signal ' + (
                ind.ema_signal === 'ABOVE' ? 'pos' :
                ind.ema_signal === 'BELOW' ? 'neg' : 'neutral'
            );

            const upEl = document.getElementById('bbUp');
            upEl.textContent = fmtPct(ind.bb_pct_to_upper);
            upEl.className = 'value ' + (ind.bb_pct_to_upper >= 40 ? 'pos' : 'neg');

            const loEl = document.getElementById('bbLo');
            loEl.textContent = fmtPct(ind.bb_pct_to_lower);
            loEl.className = 'value ' + (ind.bb_pct_to_lower >= 40 ? 'pos' : 'neg');

            document.getElementById('bbUpper').textContent = fmt(ind.bb_upper, 5);
            document.getElementById('bbLower').textContent = fmt(ind.bb_lower, 5);

            // ---- Status badge ----
            if (data.error) {
                statusEl.innerHTML = `<span class="badge err">ERROR: ${data.error}</span>`;
            } else if (!data.connected) {
                statusEl.innerHTML = `<span class="badge warn">CONNECTING...</span>`;
            } else if (!data.initialized) {
                statusEl.innerHTML = `<span class="badge warn">BOOTSTRAPPING HISTORY...</span>`;
            } else {
                statusEl.innerHTML =
                    `<span class="badge ok">LIVE</span> — ` +
                    `${data.tick_count} ticks, ${data.candles.length} candles ` +
                    `(forming ${data.forming ? data.forming.time : '—'})`;
            }
        } catch (e) {
            statusEl.innerHTML = `<span class="badge err">CLIENT ERROR: ${e.message}</span>`;
        }
    }

    tick();
    setInterval(tick, 1000);

    window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
    });
    </script>
</body>
</html>
