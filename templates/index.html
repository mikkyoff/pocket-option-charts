<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITB_otc — 1m Live Chart + Indicators</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #131722; color: #d1d4dc; }
        #header {
            padding: 10px 18px; background: #1e222d;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px;
            border-bottom: 1px solid #2a2e39;
        }
        #header .title { font-size: 14px; }
        #status { font-size: 12px; color: #787b86; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .ok { background: #26a69a; color: white; }
        .err { background: #ef5350; color: white; }
        .warn { background: #f0a500; color: white; }

        /* Chart area — chart on top, indicator bar below */
        #chartWrap {
            width: 100%;
            height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
        }
        #chart { flex: 1 1 auto; width: 100%; min-height: 0; }

        /* Indicator bar below the chart */
        #indicatorBar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            background: #2a2e39;
            border-top: 1px solid #2a2e39;
        }
        .card {
            flex: 1 1 0;
            min-width: 160px;
            background: #1e222d;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .card .label {
            font-size: 10px;
            letter-spacing: 1px;
            color: #787b86;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
        }
        .card .sub {
            font-size: 11px;
            color: #787b86;
        }
        .pos { color: #26a69a; }
        .neg { color: #ef5350; }
        .neutral { color: #d1d4dc; }
        .signal-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 700;
        }
        .bar-track {
            height: 6px;
            background: #2a2e39;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.15s linear;
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="title"><strong>BITB_otc</strong> — 1m Candles + RSI(14) + BB(20,2) + EMA(6)</div>
        <div id="status">Connecting...</div>
    </div>

    <div id="chartWrap">
        <div id="chart"></div>

        <div id="indicatorBar">
            <!-- RSI -->
            <div class="card">
                <span class="label">RSI (14)</span>
                <span class="value" id="rsiVal">—</span>
                <span class="sub" id="rsiSub">&nbsp;</span>
            </div>

            <!-- EMA Signal -->
            <div class="card">
                <span class="label">EMA (6)</span>
                <span class="value" id="emaVal">—</span>
                <span class="sub">
                    Price is
                    <span class="signal-badge" id="emaSignal">—</span>
                    EMA
                </span>
            </div>

            <!-- BB: headspace to upper -->
            <div class="card">
                <span class="label">% to Upper BB</span>
                <span class="value" id="bbUpVal">—</span>
                <div class="bar-track">
                    <div class="bar-fill" id="bbUpBar" style="width:0%; background:#26a69a;"></div>
                </div>
                <span class="sub" id="bbUpSub">Need ≥ 40% for BUY</span>
            </div>

            <!-- BB: headspace to lower -->
            <div class="card">
                <span class="label">% to Lower BB</span>
                <span class="value" id="bbLoVal">—</span>
                <div class="bar-track">
                    <div class="bar-fill" id="bbLoBar" style="width:0%; background:#ef5350;"></div>
                </div>
                <span class="sub" id="bbLoSub">Need ≥ 40% for SELL</span>
            </div>

            <!-- BB widths -->
            <div class="card">
                <span class="label">BB Bandwidth</span>
                <span class="value" id="bbBwVal">—</span>
                <span class="sub" id="bbRange">U: — / L: —</span>
            </div>
        </div>
    </div>

    <script>
    const chartContainer = document.getElementById('chart');
    const statusEl = document.getElementById('status');

    const chart = LightweightCharts.createChart(chartContainer, {
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
        timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
        rightPriceScale: { borderColor: '#2a2e39' },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    const bbUpperSeries = chart.addLineSeries({
        color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
    });
    const bbMiddleSeries = chart.addLineSeries({
        color: '#f0a500', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false,
    });
    const bbLowerSeries = chart.addLineSeries({
        color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
    });
    const emaSeries = chart.addLineSeries({
        color: '#e91e63', lineWidth: 2, priceLineVisible: false,
    });

    let initializedChart = false;

    const fmt = (n, d = 5) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(d);
    const fmtPct = (n) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(2) + '%';
    const colorClass = (n, threshold = 0) => {
        if (n === null || n === undefined) return 'neutral';
        if (n > threshold) return 'pos';
        if (n < threshold) return 'neg';
        return 'neutral';
    };

    // Local indicator recomputation for the historical candle lines.
    // (Backend gives live values per tick; the frontend rebuilds the lines
    // so the whole history of BB/EMA is drawn on the chart.)
    function buildIndicatorLines(candles, cfg) {
        const closes = [];
        const bbU = [], bbM = [], bbL = [], emaD = [];
        let ema = null;
        const k = 2 / (cfg.ema_period + 1);

        for (let i = 0; i < candles.length; i++) {
            const c = candles[i];
            closes.push(c.close);

            if (closes.length >= cfg.bb_period) {
                const win = closes.slice(-cfg.bb_period);
                const mean = win.reduce((a, b) => a + b, 0) / cfg.bb_period;
                const variance = win.reduce((a, b) => a + (b - mean) ** 2, 0) / cfg.bb_period;
                const sd = Math.sqrt(variance);
                bbU.push({ time: c.time, value: mean + cfg.bb_std * sd });
                bbM.push({ time: c.time, value: mean });
                bbL.push({ time: c.time, value: mean - cfg.bb_std * sd });
            }

            if (closes.length === cfg.ema_period) {
                ema = closes.slice(0, cfg.ema_period).reduce((a, b) => a + b, 0) / cfg.ema_period;
                emaD.push({ time: c.time, value: ema });
            } else if (closes.length > cfg.ema_period && ema !== null) {
                ema = c.close * k + ema * (1 - k);
                emaD.push({ time: c.time, value: ema });
            }
        }
        return { bbU, bbM, bbL, emaD };
    }

    async function tick() {
        try {
            const res = await fetch('/api/candles');
            const data = await res.json();

            const formatted = data.candles.map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close,
            }));

            const cfg = {
                bb_period: data.indicators.bb_period || 20,
                bb_std: data.indicators.bb_std || 2,
                ema_period: data.indicators.ema_period || 6,
            };
            const lines = buildIndicatorLines(formatted, cfg);

            candleSeries.setData(formatted);
            bbUpperSeries.setData(lines.bbU);
            bbMiddleSeries.setData(lines.bbM);
            bbLowerSeries.setData(lines.bbL);
            emaSeries.setData(lines.emaD);

            if (data.forming) {
                candleSeries.update({
                    time: data.forming.time,
                    open: data.forming.open,
                    high: data.forming.high,
                    low: data.forming.low,
                    close: data.forming.close,
                });
            }

            if (!initializedChart && formatted.length > 0) {
                chart.timeScale().fitContent();
                initializedChart = true;
            }

            // ---- Indicator bar ----
            const ind = data.indicators || {};

            const rsi = ind.rsi;
            const rsiEl = document.getElementById('rsiVal');
            rsiEl.textContent = fmt(rsi, 2);
            rsiEl.className = 'value ' + (rsi === null || rsi === undefined ? 'neutral' :
                                          rsi >= 70 ? 'neg' : rsi <= 30 ? 'pos' : 'neutral');
            document.getElementById('rsiSub').textContent =
                rsi === null || rsi === undefined ? 'warming up' :
                rsi >= 70 ? 'Overbought' :
                rsi <= 30 ? 'Oversold' : 'Neutral';

            document.getElementById('emaVal').textContent = fmt(ind.ema, 5);
            const sig = document.getElementById('emaSignal');
            sig.textContent = ind.ema_signal || '—';
            sig.className = 'signal-badge ' + (
                ind.ema_signal === 'ABOVE' ? 'pos' :
                ind.ema_signal === 'BELOW' ? 'neg' : 'neutral'
            );

            // BB: % to upper
            const up = ind.bb_pct_to_upper;
            const upEl = document.getElementById('bbUpVal');
            upEl.textContent = fmtPct(up);
            upEl.className = 'value ' + (up >= 40 ? 'pos' : 'neg');
            const upBar = document.getElementById('bbUpBar');
            upBar.style.width = (up === null || up === undefined ? 0 : Math.max(0, Math.min(100, up))) + '%';
            upBar.style.background = (up >= 40 ? '#26a69a' : '#f0a500');
            document.getElementById('bbUpSub').innerHTML =
                up >= 40 ? '✅ Headspace OK for BUY' : '⚠ Need ≥ 40% for BUY';

            // BB: % to lower
            const lo = ind.bb_pct_to_lower;
            const loEl = document.getElementById('bbLoVal');
            loEl.textContent = fmtPct(lo);
            loEl.className = 'value ' + (lo >= 40 ? 'pos' : 'neg');
            const loBar = document.getElementById('bbLoBar');
            loBar.style.width = (lo === null || lo === undefined ? 0 : Math.max(0, Math.min(100, lo))) + '%';
            loBar.style.background = (lo >= 40 ? '#ef5350' : '#f0a500');
            document.getElementById('bbLoSub').innerHTML =
                lo >= 40 ? '✅ Headspace OK for SELL' : '⚠ Need ≥ 40% for SELL';

            document.getElementById('bbBwVal').textContent = fmtPct(ind.bb_bandwidth);
            document.getElementById('bbRange').textContent =
                `U: ${fmt(ind.bb_upper)} / L: ${fmt(ind.bb_lower)}`;

            // ---- Status ----
            if (data.error) {
                statusEl.innerHTML = `<span class="badge err">ERROR: ${data.error}</span>`;
            } else if (!data.connected) {
                statusEl.innerHTML = `<span class="badge warn">CONNECTING...</span>`;
            } else if (!data.initialized) {
                statusEl.innerHTML = `<span class="badge warn">BOOTSTRAPPING...</span>`;
            } else {
                statusEl.innerHTML =
                    `<span class="badge ok">LIVE</span> ` +
                    `${data.tick_count} ticks · ${data.candles.length} candles`;
            }
        } catch (e) {
            statusEl.innerHTML = `<span class="badge err">CLIENT: ${e.message}</span>`;
        }
    }

    tick();
    setInterval(tick, 1000);

    window.addEventListener('resize', () => {
        chart.applyOptions({
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
        });
    });
    </script>
</body>
</html>
