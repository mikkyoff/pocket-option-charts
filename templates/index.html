<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GME_otc Live Chart</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #131722; color: #d1d4dc; }
        #header { padding: 12px 20px; background: #1e222d; display: flex; justify-content: space-between; align-items: center; }
        #chart { width: 100%; height: calc(100vh - 50px); }
        #status { font-size: 13px; color: #787b86; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .ok { background: #26a69a; color: white; }
        .err { background: #ef5350; color: white; }
    </style>
</head>
<body>
    <div id="header">
        <div><strong>GME_otc</strong> — 10s Candles</div>
        <div id="status">Connecting...</div>
    </div>
    <div id="chart"></div>

    <script>
        const chartContainer = document.getElementById('chart');
        const statusEl = document.getElementById('status');

        // Create chart
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            timeScale: { timeVisible: true, secondsVisible: true },
            rightPriceScale: { borderColor: '#2a2e39' },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        // Track last known candle time to decide update vs. append
        let lastCandleTime = 0;

        async function fetchCandles() {
            try {
                const res = await fetch('/api/candles');
                const data = await res.json();

                // Format for Lightweight Charts
                const formatted = data.candles.map(c => ({
                    time: c.time,
                    open: c.open, high: c.high, low: c.low, close: c.close,
                }));

                candleSeries.setData(formatted);

                if (data.forming) {
                    candleSeries.update({
                        time: data.forming.time,
                        open: data.forming.open,
                        high: data.forming.high,
                        low: data.forming.low,
                        close: data.forming.close,
                    });
                    lastCandleTime = data.forming.time;
                }

                const status = data.connected
                    ? `<span class="badge ok">CONNECTED</span> — ${data.tick_count} ticks, ${data.candles.length} candles`
                    : `<span class="badge err">DISCONNECTED</span>`;
                statusEl.innerHTML = status;
            } catch (e) {
                statusEl.innerHTML = `<span class="badge err">ERROR: ${e.message}</span>`;
            }
        }

        // Poll every second for updates (simple, reliable)
        fetchCandles();
        setInterval(fetchCandles, 1000);

        // Responsive
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });
    </script>
</body>
</html>
